<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simulador educativo de inversión (CETES, pagaré, ahorro), crédito con tabla de amortización y CAT aproximado, y metas de ahorro en pesos mexicanos."
    />
    <meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1C1D" media="(prefers-color-scheme: dark)" />
    <title>Simulador Financiero MX</title>
    <script>
      // Aplica el tema guardado antes de pintar para evitar parpadeo.
      try {
        var t = localStorage.getItem('sfmx-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
